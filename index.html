<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/carnet_vol/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Carnet de vol personnel pour le parapente et le speedflying.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- iOS only honours the status bar style below (app drawn under the
       status bar and the home indicator) with its own capable tag. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Carnet de vol">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Carnet de vol</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Stops iOS Safari's own edge-swipe-back gesture from intercepting a
    horizontal swipe before the app's own swipe-to-go-back gesture gets it.
  -->
  <!--
    The page behind the app shows in the status bar area (iOS tints and
    fades it from the page background) and below the app, around the home
    indicator. It is painted in the app's colours: the top bar colour above,
    the screen background below. The app updates them per screen through
    carnetVolSetPageColors (lib/widgets/page_colors.dart).
  -->
  <style>
    html, body { overscroll-behavior-x: none; }
    html, body {
      background: linear-gradient(to bottom, #0B7285 0 50%, #f2f3fa 50% 100%);
      background-color: #f2f3fa;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background: linear-gradient(to bottom, #0B7285 0 50%, #191c20 50% 100%);
        background-color: #191c20;
      }
    }
  </style>
  <meta name="theme-color" content="#0B7285">
  <script>
    window.carnetVolSetPageColors = function (top, bottom) {
      var background = 'linear-gradient(to bottom, ' + top + ' 0 50%, ' + bottom + ' 50% 100%)';
      [document.documentElement, document.body].forEach(function (el) {
        if (!el) return;
        el.style.background = background;
        el.style.backgroundColor = bottom;
      });
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = top;
    };
  </script>

  <!--
    Full-screen layout on iPhone: the status bar is translucent (no band at
    the top) and the page extends under it and under the home indicator.
    Flutter replaces the viewport meta tag with its own, without
    viewport-fit=cover, so it is added back whenever a tag is inserted.
    Flutter web also reports no safe-area insets, so the app reads them
    from CSS env() through carnetVolSafeAreaInsets (lib/services/safe_area*).
  -->
  <script>
    (function () {
      function coverViewport() {
        document.querySelectorAll('meta[name="viewport"]').forEach(function (m) {
          if (m.content.indexOf('viewport-fit') < 0) m.content += ', viewport-fit=cover';
        });
      }
      new MutationObserver(coverViewport).observe(document.head, { childList: true });
      coverViewport();

      // [top, bottom] in CSS pixels (= Flutter logical pixels).
      window.carnetVolSafeAreaInsets = function () {
        var probe = document.createElement('div');
        probe.style.cssText = 'position:fixed;visibility:hidden;' +
          'padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)';
        document.documentElement.appendChild(probe);
        var style = getComputedStyle(probe);
        var top = parseFloat(style.paddingTop) || 0;
        var bottom = parseFloat(style.paddingBottom) || 0;
        probe.remove();
        // Some iOS versions stop the page (and so the app) above the home
        // indicator anyway: only the part of the inset the app actually
        // covers needs keeping clear.
        if (window.navigator.standalone) {
          var gap = window.screen.height - document.documentElement.clientHeight;
          bottom = Math.max(0, bottom - Math.max(0, gap));
        }
        return [top, bottom];
      };
    })();
  </script>

  <!--
    This app no longer registers a service worker (updates propagate faster
    without the offline app-shell cache). This cleans up any worker left
    behind by an older build so it stops intercepting requests.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((registrations) => {
        registrations.forEach((registration) => registration.unregister());
      });
    }

    // Photos/videos are no longer stored in the app (they are looked up in
    // the Photos library by date instead): free the space used by the old
    // in-app media database.
    if ('indexedDB' in window) {
      indexedDB.deleteDatabase('carnet_vol_media');
    }
  </script>

  <!--
    Update check. GitHub Pages lets browsers cache every file for 10 minutes,
    so a plain reload can keep serving the old build. scripts/deploy.sh
    replaces 20261103-1045-b7dfd4f below and publishes build.json (the live build id
    plus the list of its files). When they differ, the new files are
    re-downloaded into the HTTP cache before reloading.
  -->
  <script>
    window.carnetVolBuildId = '20261103-1045-b7dfd4f';
    (function () {
      var stamped = window.carnetVolBuildId.indexOf('__') !== 0;

      function fetchLatest() {
        if (!stamped) return Promise.resolve(null);
        return fetch('build.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; });
      }

      function applyUpdate(build) {
        var files = ['./', 'index.html'].concat((build && build.files) || []);
        return Promise.all(files.map(function (f) {
          return fetch(f, { cache: 'reload' }).catch(function () {});
        })).then(function () { location.reload(); });
      }

      // Resolves to the live build id, or null when it can't be checked
      // (offline, or a local dev build that was never stamped).
      window.carnetVolFetchLatestBuild = function () {
        return fetchLatest().then(function (b) { return b ? b.buildId : null; });
      };

      window.carnetVolApplyUpdate = function () {
        return fetchLatest().then(applyUpdate);
      };

      // On launch, update straight away. The session flag stops a reload
      // loop if the CDN briefly still serves the previous index.html.
      fetchLatest().then(function (build) {
        if (!build || build.buildId === window.carnetVolBuildId) return;
        var key = 'carnetVolUpdateTried';
        if (sessionStorage.getItem(key) === build.buildId) return;
        sessionStorage.setItem(key, build.buildId);
        applyUpdate(build);
      });
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
