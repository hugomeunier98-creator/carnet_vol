<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/carnet_vol/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Carnet de vol personnel pour le parapente et le speedflying.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!--
    "default": the app starts below the status bar, which iOS paints with
    theme-color, kept equal to the current screen's top bar colour (see
    carnetVolSetPageColors below). "black-translucent" draws the app under
    the status bar, but iOS 26 then blurs and dims that area and leaves a
    band below the app the height of the status bar.
  -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Carnet de vol">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Carnet de vol</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Stops iOS Safari's own edge-swipe-back gesture from intercepting a
    horizontal swipe before the app's own swipe-to-go-back gesture gets it.
  -->
  <!--
    The page behind the app can show around it (status bar, home indicator,
    overscroll). It is painted in the app's colours: the top bar colour
    above, the screen background below. iOS paints the status bar with the
    page's background-color (not the gradient): it is the top bar colour.
    The app updates them per screen through carnetVolSetPageColors
    (lib/widgets/page_colors.dart). iOS ignores changes made to the existing
    theme-color tag and styles, so both are replaced by new elements.
  -->
  <!--
    The accent chosen in the app (menu ⋯ → Couleur de l'appli), saved by
    shared_preferences as "flutter.accent_color" (ARGB number): it colours
    the page and the loading screen from the start, hence the status bar.
  -->
  <script>
    (function () {
      var accent = '#D9480F';
      try {
        var argb = JSON.parse(localStorage.getItem('flutter.accent_color'));
        if (typeof argb === 'number') {
          accent = '#' + ('00000' + (argb & 0xFFFFFF).toString(16)).slice(-6);
        }
      } catch (e) {}
      document.documentElement.style.setProperty('--accent', accent);
      window.carnetVolAccent = accent;
    })();
  </script>
  <style>
    html, body { overscroll-behavior-x: none; }
    /* Full height, or the two-colour gradient repeats as stripes while the
       page is still empty (during loading). */
    html, body { height: 100%; margin: 0; background-repeat: no-repeat; }
    html, body {
      background: linear-gradient(to bottom, var(--accent) 0 50%, #faf2f0 50% 100%);
      background-color: var(--accent);
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background: linear-gradient(to bottom, var(--accent) 0 50%, #1e1b1a 50% 100%);
        background-color: var(--accent);
      }
    }
  </style>
  <meta name="theme-color" content="#D9480F">
  <script>
    document.querySelector('meta[name="theme-color"]').content =
      window.carnetVolAccent;
  </script>
  <script>
    window.carnetVolSetPageColors = function (top, bottom) {
      var style = document.createElement('style');
      style.id = 'carnet-vol-page-colors';
      style.textContent = 'html, body { background: linear-gradient(to bottom, ' +
        top + ' 0 50%, ' + bottom + ' 50% 100%) no-repeat !important; ' +
        'background-color: ' + top + ' !important; }';
      var oldStyle = document.getElementById(style.id);
      if (oldStyle) oldStyle.remove();
      document.head.appendChild(style);

      document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
        m.remove();
      });
      var meta = document.createElement('meta');
      meta.name = 'theme-color';
      meta.content = top;
      document.head.appendChild(meta);
    };

    // Flutter adds its own, transparent, theme-color tag (from the app
    // title): it would override the screen colour.
    new MutationObserver(function () {
      var flutterMeta = document.getElementById('flutterweb-theme');
      if (flutterMeta) flutterMeta.remove();
    }).observe(document.head, { childList: true });
  </script>

  <!--
    Layout down to the bottom edge of the iPhone, under the home indicator.
    Flutter replaces the viewport meta tag with its own, without
    viewport-fit=cover, so it is added back whenever a tag is inserted.
    Flutter web also reports no safe-area insets, so the app reads them
    from CSS env() through carnetVolSafeAreaInsets (lib/services/safe_area*).
  -->
  <script>
    (function () {
      function coverViewport() {
        document.querySelectorAll('meta[name="viewport"]').forEach(function (m) {
          if (m.content.indexOf('viewport-fit') < 0) m.content += ', viewport-fit=cover';
        });
      }
      new MutationObserver(coverViewport).observe(document.head, { childList: true });
      coverViewport();

      // [top, bottom] in CSS pixels (= Flutter logical pixels).
      window.carnetVolSafeAreaInsets = function () {
        var probe = document.createElement('div');
        probe.style.cssText = 'position:fixed;visibility:hidden;' +
          'padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)';
        document.documentElement.appendChild(probe);
        var style = getComputedStyle(probe);
        var top = parseFloat(style.paddingTop) || 0;
        var bottom = parseFloat(style.paddingBottom) || 0;
        probe.remove();
        return [top, bottom];
      };
    })();
  </script>

  <!--
    This app no longer registers a service worker (updates propagate faster
    without the offline app-shell cache). This cleans up any worker left
    behind by an older build so it stops intercepting requests.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((registrations) => {
        registrations.forEach((registration) => registration.unregister());
      });
    }

    // Photos/videos are no longer stored in the app (they are looked up in
    // the Photos library by date instead): free the space used by the old
    // in-app media database.
    if ('indexedDB' in window) {
      indexedDB.deleteDatabase('carnet_vol_media');
    }
  </script>

  <!--
    Update check. GitHub Pages lets browsers cache every file for 10 minutes,
    so a plain reload can keep serving the old build. scripts/deploy.sh
    replaces 20261108-1820-0884e10 below and publishes build.json (the live build id
    plus the list of its files). When they differ, the new files are
    re-downloaded into the HTTP cache before reloading.
  -->
  <script>
    window.carnetVolBuildId = '20261108-1820-0884e10';
    (function () {
      var stamped = window.carnetVolBuildId.indexOf('__') !== 0;

      function fetchLatest() {
        if (!stamped) return Promise.resolve(null);
        return fetch('build.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; });
      }

      function applyUpdate(build) {
        var files = ['./', 'index.html'].concat((build && build.files) || []);
        return Promise.all(files.map(function (f) {
          return fetch(f, { cache: 'reload' }).catch(function () {});
        })).then(function () { location.reload(); });
      }

      // Resolves to the live build id, or null when it can't be checked
      // (offline, or a local dev build that was never stamped).
      window.carnetVolFetchLatestBuild = function () {
        return fetchLatest().then(function (b) { return b ? b.buildId : null; });
      };

      window.carnetVolApplyUpdate = function () {
        return fetchLatest().then(applyUpdate);
      };

      // On launch, update straight away. The session flag stops a reload
      // loop if the CDN briefly still serves the previous index.html.
      fetchLatest().then(function (build) {
        if (!build || build.buildId === window.carnetVolBuildId) return;
        var key = 'carnetVolUpdateTried';
        if (sessionStorage.getItem(key) === build.buildId) return;
        sessionStorage.setItem(key, build.buildId);
        applyUpdate(build);
      });
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    Loading screen, shown at least 1 s and until the app draws its first
    frame, dark like the app's dark background. iOS colours the status bar
    from the top of the page shown at launch and keeps that colour (a thin
    line is not enough): the splash starts with an orange band shaped like
    the home screen's top bar (120 px, rounded 24 px), so the status bar is
    orange and the app's header takes the band's place.
  -->
  <style>
    #splash::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 120px;
      background: var(--accent); border-radius: 0 0 24px 24px;
    }
  </style>
  <style>
    #splash {
      position: absolute; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; background: #1e1b1a; color: #fff;
      font: 800 28px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: -0.5px; transition: opacity .25s ease;
    }
    #splash img { width: 112px; height: 112px; border-radius: 26px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .45); }
    #splash.done { opacity: 0; pointer-events: none; }
  </style>
  <div id="splash">
    <img src="icons/Icon-512.png" alt="">
    <div>Carnet de Vol</div>
  </div>
  <script>
    (function () {
      var shownAt = Date.now();
      window.addEventListener('flutter-first-frame', function () {
        var wait = Math.max(0, 1000 - (Date.now() - shownAt));
        setTimeout(function () {
          var splash = document.getElementById('splash');
          if (!splash) return;
          splash.classList.add('done');
          setTimeout(function () { splash.remove(); }, 300);
        }, wait);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
